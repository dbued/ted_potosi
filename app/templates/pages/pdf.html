{% extends 'layouts/base.html' %}
{% block title %}Visor de PDF{% endblock %}
{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4" style="color: #003366;">Visor de documentos PDF</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <iframe src="{{ url_for('pdf.view_pdf', filename='documento_muestra.pdf') }}" width="100%" height="700px" style="border: none;"></iframe>
            </div>
        </div>
        <div class="mt-3">
            <a href="{{ url_for('pdf.download_file', filename='documento_muestra.pdf') }}" class="btn btn-primary" style="background-color: #003366; border-color: #003366;">
                <i class="fas fa-download me-2"></i>Descargar PDF
            </a>
        </div>
    </div>
</div>
{% endblock %}
